<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assure Global Sourcing | AGS</title>
  <meta name="description" content="Assure Global Sourcing — responsible apparel sourcing, product development, quality and global delivery.">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 74px; }
    body { margin: 0; background: #fff; font-family: Arial, Helvetica, sans-serif; }

    /* Sticky navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      min-height: 74px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 8px 24px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid rgba(12,48,92,.12);
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      backdrop-filter: blur(8px);
    }
    .brand {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      text-decoration: none;
    }
    .brand img {
      width: 72px;
      height: 54px;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .nav {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .nav a {
      color: #12365f;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .35px;
      padding: 9px 8px;
      border-radius: 5px;
      white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .nav a:hover, .nav a:focus {
      background: #edf4fb;
      color: #1459a6;
      outline: none;
    }
    .menu-btn {
      display: none;
      border: 0;
      background: #123b70;
      color: #fff;
      border-radius: 6px;
      padding: 9px 12px;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    /* Every slide is displayed exactly as the supplied artwork.
       No text, logos, colors, or design elements are recreated/altered. */
    .hero {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #fff;
    }
    .hero-slide {
      display: none;
      width: 100%;
      line-height: 0;
    }
    .hero-slide.active { display: block; }
    .hero-slide img {
      width: 100%;
      height: auto;
      display: block;
    }
    .hero-dots {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 5;
    }
    .hero-dots button {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
      box-shadow: 0 0 0 1px rgba(0,0,0,.12);
      cursor: pointer;
    }
    .hero-dots button.active { background: #fff; }

    /* Section artwork */
    .sheet {
      width: 100%;
      scroll-margin-top: 74px;
      line-height: 0;
      background: #fff;
    }
    .sheet img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    @media (max-width: 1100px) {
      .topbar { gap: 10px; padding: 7px 14px; }
      .nav a { font-size: 10px; padding: 8px 5px; }
      .brand img { width: 60px; height: 48px; }
    }

    @media (max-width: 820px) {
      .topbar { min-height: 62px; }
      .brand img { width: 60px; height: 45px; }
      .menu-btn { display: block; margin-left: auto; }
      .nav {
        display: none;
        position: absolute;
        top: 62px;
        left: 0;
        right: 0;
        padding: 10px 14px 14px;
        background: rgba(255,255,255,.99);
        box-shadow: 0 8px 18px rgba(0,0,0,.10);
        border-top: 1px solid rgba(12,48,92,.08);
        max-height: calc(100vh - 62px);
        overflow-y: auto;
      }
      .nav.open { display: flex; flex-direction: column; align-items: stretch; }
      .nav a { font-size: 13px; padding: 12px 10px; }
      .hero-dots { bottom: 9px; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#home" aria-label="Assure Global Sourcing home">
    <img src="assets/ags-logo.png" alt="AGS - Assure Global Sourcing">
  </a>

  <button class="menu-btn" id="menuBtn" aria-label="Open navigation" aria-expanded="false">☰</button>

  <nav class="nav" id="mainNav" aria-label="Main navigation">
    <a href="#about-ags">ABOUT AGS</a>
    <a href="#our-sourcing-expertise">OUR SOURCING EXPERTISE</a>
    <a href="#our-sourcing-process">OUR SOURCING PROCESS</a>
    <a href="#sustainability">SUSTAINABILITY &amp; RESPONSIBLE SOURCING</a>
    <a href="#quality-compliance">QUALITY &amp; COMPLIANCE</a>
    <a href="#sourcing-network">OUR SOURCING NETWORK</a>
    <a href="#markets">MARKET WE SERVE</a>
    <a href="#how-we-work">HOW WE WORK</a>
    <a href="#lets-work-together">LETS WORK TOGETHER</a>
  </nav>
</header>

<main id="home">

  <!-- 3 supplied hero banners: automatically changes every 10 seconds -->
  <section class="hero" aria-label="AGS hero banners">
    <div class="hero-slide active"><img src="assets/hero-1.png" alt="AGS hero banner 1"></div>
    <div class="hero-slide"><img src="assets/hero-2.png" alt="AGS hero banner 2"></div>
    <div class="hero-slide"><img src="assets/hero-3.png" alt="AGS hero banner 3"></div>
    <div class="hero-dots" aria-label="Hero banner controls">
      <button class="active" aria-label="Show hero banner 1"></button>
      <button aria-label="Show hero banner 2"></button>
      <button aria-label="Show hero banner 3"></button>
    </div>
  </section>

  <section class="sheet" id="about-ags">
    <img src="assets/about-ags.png" alt="About AGS">
  </section>

  <section class="sheet" id="our-sourcing-expertise">
    <img src="assets/sourcing-expertise.png" alt="Our Sourcing Expertise">
  </section>

  <section class="sheet" id="our-sourcing-process">
    <img src="assets/sourcing-process.png" alt="Our Sourcing Process">
  </section>

  <section class="sheet" id="sustainability">
    <img src="assets/sustainability.png" alt="Sustainability and Responsible Sourcing">
  </section>

  <section class="sheet" id="quality-compliance">
    <img src="assets/quality-compliance.png" alt="Quality and Compliance">
  </section>

  <section class="sheet" id="sourcing-network">
    <img src="assets/sourcing-network.png" alt="Our Sourcing Network">
  </section>

  <section class="sheet" id="markets">
    <img src="assets/markets-we-serve.png" alt="Markets We Serve">
  </section>

  <section class="sheet" id="how-we-work">
    <img src="assets/how-we-work.png" alt="How We Work">
  </section>

  <section class="sheet" id="lets-work-together">
    <img src="assets/lets-work-together.png" alt="Let's Work Together">
  </section>

</main>

<script>
  // Hero carousel: exactly 10 seconds per banner.
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dots button');
  let current = 0;
  let timer;

  function showSlide(index) {
    current = (index + slides.length) % slides.length;
    slides.forEach((slide, i) => slide.classList.toggle('active', i === current));
    dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
  }

  function startCarousel() {
    clearInterval(timer);
    timer = setInterval(() => showSlide(current + 1), 10000);
  }

  dots.forEach((dot, i) => {
    dot.addEventListener('click', () => {
      showSlide(i);
      startCarousel();
    });
  });

  showSlide(0);
  startCarousel();

  // Mobile navigation
  const menuBtn = document.getElementById('menuBtn');
  const mainNav = document.getElementById('mainNav');

  menuBtn.addEventListener('click', () => {
    const open = mainNav.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuBtn.textContent = open ? '✕' : '☰';
  });

  document.querySelectorAll('#mainNav a').forEach(link => {
    link.addEventListener('click', () => {
      mainNav.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
      menuBtn.textContent = '☰';
    });
  });
</script>
</body>
</html>
